[project]
name = "iasp"
version = "0.1.0"
requires-python = "~=3.12.0"
dependencies = [
    # Framework e componenti UI (bloccati alla minor version con ~=)
    "django<6.0",
    "django-filter~=26.1",
    "django-tables2~=3.0.0",
    "design-django-theme~=2.18.0",
    
    # Generazione e gestione documenti
    "weasyprint~=69.0",
    "pypdf~=6.16.0",
    "openpyxl>=3.1.5",

    # Utility e librerie esterne
    "cryptojwt>=1.11.0",
    "zeep~=4.3.0",
    "requests>=2.34.2",
    "phonenumbers>=9.0.38",
    "python-magic>=0.4.27",
]

[dependency-groups]
auth = [
    "djangosaml2~=1.12",
    "pysaml2>=7.5.4",
]
deploy = [
    "uwsgi~=2.0.0",
]
dev = [
    "autoflake>=2.4.0",
    "autopep8>=2.3.2",
    "bandit>=1.9.4",
    "black>=26.5.1",
    "flake8>=7.3.0",
    "isort>=9.0.1",
]
unical = [
    "django-unical-bootstrap-italia",
    "mysqlclient~=2.2.0",
    "graypy>=2.1.0",
]

[tool.uv]
# Garantisce che pyOpenSSL sia sempre >=24.0.0 a livello globale, 
# evitando incompatibilità con cryptography indipendentemente dai gruppi installati
override-dependencies = [
    "pyOpenSSL>=24.0.0",
]

[tool.uv.sources]
django-unical-bootstrap-italia = { git = "https://github.com/UniversitaDellaCalabria/django-unical-bootstrap-italia.git", branch = "v2" }